[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Netlify's default installs devDependencies; Vite and TypeScript are needed.
  NPM_FLAGS = "--include=dev"

# Client-side routing: every unmatched path must serve the SPA entry point,
# otherwise a refresh on /campaigns returns a 404 from Netlify's CDN.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed assets are immutable; the HTML shell must never be cached.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
