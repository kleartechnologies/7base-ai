[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Netlify's default installs devDependencies; Vite and TypeScript are needed.
  NPM_FLAGS = "--include=dev"

# Client-side routing: every unmatched path must serve the SPA entry point,
# otherwise a refresh on /campaigns returns a 404 from Netlify's CDN.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed assets are immutable; the HTML shell must never be cached.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Deliberately NOT a full CSP. Sign-in uses Firebase signInWithPopup,
    # whose gapi/iframe channel needs script-src and frame-src entries that
    # Google has changed before, and there is no staging site to catch a
    # breakage before it locks every user out. So only the directives that
    # cannot interfere with auth, Firestore, or Vite output are enforced:
    # no plugin content, no <base> hijack, no form exfiltration, no framing.
    # script-src / connect-src stay unset (unrestricted) on purpose.
    Content-Security-Policy = "object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
